<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaceMe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#fff;color:#000;overflow-x:hidden}
.hidden{display:none!important}
.screen{min-height:100vh;display:flex;flex-direction:column}
button{border:0;cursor:pointer;background:none;font-size:15px}
input,select{border:1px solid #ddd;border-radius:10px;padding:12px;font-size:16px;width:100%;margin:6px 0;outline:none;transition:.2s}
input:focus,select:focus{border-color:#0084ff}
.primary{width:100%;padding:14px;border-radius:10px;background:#0084ff;color:#fff;font-weight:700;margin-top:10px;font-size:16px}
.secondary{width:100%;padding:14px;border-radius:10px;background:#f0f2f5;color:#0084ff;font-weight:700;margin-top:10px;font-size:16px}
.err{color:#e53935;font-size:13px;margin-top:6px;min-height:18px;text-align:center}
#smsToast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;background:#1c1c2e;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#authPage{background:linear-gradient(135deg,#0084ff 0%,#7b2ff7 100%);align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:360px;background:#fff;border-radius:24px;padding:30px 24px;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.logo{text-align:center;font-size:36px;font-weight:800;color:#0084ff;margin-bottom:4px}
.logo-sub{text-align:center;color:#888;font-size:13px;margin-bottom:18px}
.tabs{display:flex;background:#f0f2f5;border-radius:12px;margin-bottom:14px;padding:4px}
.tab{flex:1;padding:10px;border-radius:10px;font-weight:600;color:#666;transition:.2s}
.tab.active{background:#fff;color:#0084ff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.brand{font-size:24px;font-weight:800;color:#0084ff}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#00c6ff,#7b2ff7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;background-size:cover;background-position:center}
.avatar.small{width:38px;height:38px;font-size:15px}
.searchbar{padding:10px 16px;background:#fff}
.searchbar input{background:#f0f2f5;border:none;margin:0;border-radius:20px}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:.1s}
.row:active{background:#f0f8ff}
.row .info{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.badge{color:#0084ff;font-size:14px}
.sub{color:#888;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{color:#999;font-size:11px;flex-shrink:0}
.bottom{display:flex;border-top:1px solid #eee;background:#fff;position:sticky;bottom:0}
.nav{flex:1;padding:14px;background:none;color:#888;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav.active{color:#0084ff}
.chat-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.chat-top button{background:none;font-size:22px;padding:4px}
.pname{flex:1;font-weight:700;font-size:17px}
#chatBox{flex:1;overflow-y:auto;padding:16px;background:#fff;display:flex;flex-direction:column;gap:4px}
.msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;word-break:break-word;line-height:1.4}
.msg.me{align-self:flex-end;background:#0084ff;color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#e4e6eb;color:#000;border-bottom-left-radius:4px}
#msgForm{display:flex;gap:8px;padding:12px 14px;background:#fff;border-top:1px solid #eee;align-items:center}
#msgForm input{margin:0;background:#f0f2f5;border:none;border-radius:24px;flex:1}
#msgForm button{width:48px;height:48px;border-radius:50%;background:#0084ff;color:#fff;font-size:18px;flex-shrink:0}
.admin-head{padding:16px;background:#1c1c2e;color:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.stat{display:flex;gap:12px;padding:14px 16px}
.stat .box{flex:1;background:#f0f8ff;border-radius:14px;padding:16px;text-align:center}
.num{font-size:26px;font-weight:800;color:#0084ff}
.abtn{padding:6px 12px;border-radius:8px;background:#0084ff;color:#fff;margin-left:6px;font-size:12px;font-weight:600}
.abtn.red{background:#e53935}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:flex;align-items:center;justify-content:center;color:#fff}
.overlay .card{background:#111;padding:26px;border-radius:20px;text-align:center;max-width:90%}
.overlay .card h3{margin-bottom:16px;font-size:18px}
.overlay .card button{margin:6px;padding:12px 18px;border-radius:12px;background:#0084ff;color:#fff;font-weight:600}
.overlay .card button.red{background:#e53935}
#callBox{flex-direction:column;justify-content:flex-end}
#callStatus{position:absolute;top:24px;width:100%;text-align:center;font-size:17px;font-weight:600}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#000}
#localVideo{position:absolute;right:12px;bottom:96px;width:110px;border-radius:12px;border:2px solid #fff}
.controls{position:absolute;bottom:24px;width:100%;display:flex;justify-content:center;gap:14px}
.controls button{width:56px;height:56px;border-radius:50%;background:#333;color:#fff;font-size:20px}
.controls button.red{background:#e53935}
.profile-setup{padding:20px}
.profile-preview{width:100px;height:100px;border-radius:50%;background:#f0f2f5;margin:0 auto 16px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:36px;color:#888}
</style>
</head>
<body>

<div id="smsToast" class="hidden"> <span id="smsText"></span></div>

<!-- AUTH SCREEN -->
<div id="authPage" class="screen">
  <div class="auth-card">
    <div class="logo">FaceMe</div>
    <div class="logo-sub">Chat • Audio • Video — Messenger এর মতো</div>
    <div class="tabs">
      <button id="tabLogin" class="tab active">Login</button>
      <button id="tabReg" class="tab">Register</button>
    </div>
    
    <!-- LOGIN BOX -->
    <div id="loginBox">
      <input id="loginUser" placeholder="Username বা Mobile number" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn" class="primary">Login</button>
      <p id="loginErr" class="err"></p>
    </div>

    <!-- REGISTER BOX -->
    <div id="regBox" class="hidden">
      <div id="regStep1">
        <input id="regPhone" placeholder="Mobile number (01XXXXXXXXX)" inputmode="tel" />
        <button id="sendOtpBtn" class="primary">Send OTP</button>
      </div>
      <div id="regStep2" class="hidden">
        <input id="otpInput" placeholder="6 digit OTP" inputmode="numeric" />
        <button id="verifyOtpBtn" class="primary">Verify</button>
      </div>
      <div id="regStep3" class="hidden">
        <input id="regName" placeholder="তোমার নাম" />
        <input id="regUsername" placeholder="Username (english, no space)" />
        <input id="regPass" type="password" placeholder="Password (৬+ অক্ষর)" />
        <button id="saveProfileBtn" class="primary">Complete</button>
      </div>
      <p id="regErr" class="err"></p>
    </div>
  </div>
</div>

<!-- PROFILE SETUP SCREEN -->
<div id="profileSetupPage" class="screen hidden">
  <div class="auth-card" style="margin:auto">
    <h2 style="text-align:center;margin-bottom:16px;color:#0084ff">প্রোফাইল সেটআপ</h2>
    <div id="profilePreview" class="profile-preview">👤</div>
    <input id="setupPhotoUrl" placeholder="Profile Picture URL (optional)" />
    <input id="setupName" placeholder="Full Name" />
    <input id="setupAddress" placeholder="Address / ঠিকানা" />
    <input id="setupPhone" placeholder="Phone Number" inputmode="tel" />
    <button id="saveSetupBtn" class="primary">Save Profile</button>
    <p id="setupErr" class="err"></p>
  </div>
</div>

<!-- MAIN SCREEN -->
<div id="mainPage" class="screen hidden">
  <div class="top">
    <div class="brand">FaceMe</div>
    <div style="display:flex;gap:10px;align-items:center">
      <button id="adminBtn" class="hidden" style="font-size:20px">🛡️</button>
      <div id="myAvatar" class="avatar small"></div>
    </div>
  </div>
  <div class="searchbar"><input id="searchInput" placeholder="🔍 People search..." /></div>
  <div id="listChats" class="list"></div>
  <div id="listPeople" class="list hidden"></div>
  <nav class="bottom">
    <button id="navChats" class="nav active"> Chats</button>
    <button id="navPeople" class="nav">👥 People</button>
    <button id="navLogout" class="nav">🚪 Logout</button>
  </nav>
</div>

<!-- CHAT SCREEN -->
<div id="chatPage" class="screen hidden">
  <div class="chat-top">
    <button id="backBtn">←</button>
    <div id="peerAvatar" class="avatar small"></div>
    <div id="peerName" class="pname"></div>
    <button id="callAudioBtn">📞</button>
    <button id="callVideoBtn">🎥</button>
  </div>
  <div id="chatBox"></div>
  <form id="msgForm">
    <input id="msgInput" placeholder="Message..." autocomplete="off" />
    <button type="submit">➤</button>
  </form>
</div>

<!-- ADMIN SCREEN -->
<div id="adminPage" class="screen hidden">
  <div class="admin-head">
    <b>🛡️ Admin Panel</b>
    <button id="adminBack" style="background:#333;color:#fff;padding:8px 14px;border-radius:8px">← Back</button>
  </div>
  <div class="stat">
    <div class="box"><div class="num" id="statUsers">0</div>Users</div>
    <div class="box"><div class="num" id="statChats">0</div>Chats</div>
  </div>
  <div style="padding:0 16px 10px">
    <h3 style="margin-bottom:8px;font-size:16px">Create User Manually (If OTP fails)</h3>
    <input id="adminNewPhone" placeholder="User Phone" inputmode="tel" />
    <input id="adminNewName" placeholder="User Name" />
    <input id="adminNewUsername" placeholder="Username (unique)" />
    <input id="adminNewPass" type="password" placeholder="Password" />
    <button id="adminCreateUserBtn" class="secondary">Create User</button>
    <p id="adminCreateErr" class="err"></p>
  </div>
  <div id="adminUsers" class="list"></div>
  <div id="adminChats" class="list" style="border-top:4px solid #eee"></div>
</div>

<!-- INCOMING CALL OVERLAY -->
<div id="incomingBox" class="overlay hidden">
  <div class="card">
    <h3 id="incomingText">Call আসছে</h3>
    <button id="acceptBtn">✅ Accept</button>
    <button id="declineBtn" class="red">❌ Decline</button>
  </div>
</div>

<!-- ACTIVE CALL OVERLAY -->
<div id="callBox" class="overlay hidden">
  <div id="callStatus">📞 Calling...</div>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="controls">
    <button id="micBtn">🎤</button>
    <button id="camBtn"></button>
    <button id="endBtn" class="red"></button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// --- FIREBASE CONFIG ---
const firebaseConfig = {
  apiKey: "AIzaSyB2FM5vQfdjqFAJ7E3xGCOgwRuwvy1CsXc",
  authDomain: "my-chat-67ce1.firebaseapp.com",
  databaseURL: "https://my-chat-67ce1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-chat-67ce1",
  storageBucket: "my-chat-67ce1.firebasestorage.app",
  messagingSenderId: "1397970900",
  appId: "1:1397970900:web:3c2a7960cf5070dae8e841",
  measurementId: "G-14WY8BTZME"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const APP_DOMAIN = "faceme.app";

// --- UTILS ---
const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove("hidden");
const hide = id => $(id).classList.add("hidden");
const initials = n => (n || "U").trim().charAt(0).toUpperCase();
const chatIdFor = uid => [me.uid, uid].sort().join("_");
const setBg = (el, url) => { el.style.backgroundImage = url ? `url(${url})` : ''; el.textContent = url ? '' : initials(el.dataset.name || 'U'); };

// --- STATE ---
let me = null, usersCache = {}, tempUser = null, pendingProfile = false;
let lastPhone = "", demoOtp = "";
let currentPeerUid = null, msgRef = null, usersRef = null, myChatsRef = null;
let metaSubs = {}, myChats = {};
let pc = null, localStream = null, callId = null, role = null;
let remoteDescSet = false, pendingCandidates = [], currentIncoming = null;
let callRef = null, candRef = null, incRef = null;
let setupUid = null;

// --- DEMO OTP SYSTEM ---
function generateDemoOtp() { return Math.floor(100000 + Math.random() * 900000).toString(); }
function showToast(msg) { $("smsText").textContent = msg; show("smsToast"); setTimeout(() => hide("smsToast"), 4000); }

// --- AUTH TABS ---
$("tabLogin").onclick = () => { $("tabLogin").classList.add("active"); $("tabReg").classList.remove("active"); show("loginBox"); hide("regBox"); };
$("tabReg").onclick = () => { $("tabReg").classList.add("active"); $("tabLogin").classList.remove("active"); hide("loginBox"); show("regBox"); };

// --- REGISTRATION FLOW ---
$("sendOtpBtn").onclick = () => {
  $("regErr").textContent = "";
  const phone = $("regPhone").value.trim();
  if (!phone || phone.length < 11) { $("regErr").textContent = "সঠিক mobile number দিন"; return; }
  lastPhone = phone;
  demoOtp = generateDemoOtp();
  showToast(`📩 আপনার OTP: ${demoOtp}`);
  hide("regStep1"); show("regStep2");
};

$("verifyOtpBtn").onclick = () => {
  const entered = $("otpInput").value.trim();
  if (entered === demoOtp) {
    auth.signInAnonymously().then(cred => {
      tempUser = cred.user;
      pendingProfile = true;
      hide("regStep2"); show("regStep3");
    }).catch(e => { $("regErr").textContent = e.message; });
  } else {
    $("regErr").textContent = "ভুল OTP! আবার চেষ্টা করুন";
  }
};

$("saveProfileBtn").onclick = async () => {
  const name = $("regName").value.trim();
  const uname = $("regUsername").value.trim().toLowerCase();
  const pass = $("regPass").value;
  
  if (!name || !uname || pass.length < 6) { $("regErr").textContent = "সব ঘর ঠিকভাবে পূরণ করো (password ৬+ অক্ষর)"; return; }
  if (!/^[a-z0-9_]+$/.test(uname)) { $("regErr").textContent = "username এ বাংলা/space চলবে না"; return; }
  if (uname === "admin") { $("regErr").textContent = "'admin' username reserved"; return; }
  
  try {
    const ex = await db.ref("usernameIndex/" + uname).get();
    if (ex.exists()) { $("regErr").textContent = "এই username আগে থেকেই নেওয়া"; return; }
    
    const cred = firebase.auth.EmailAuthProvider.credential(uname + "@" + APP_DOMAIN, pass);
    await tempUser.linkWithCredential(cred);
    
    await db.ref("users/" + tempUser.uid).set({ 
      name, username: uname, phone: lastPhone, role: "user", verified: false,
      photoUrl: "", address: "", createdAt: firebase.database.ServerValue.TIMESTAMP 
    });
    await db.ref("usernameIndex/" + uname).set(tempUser.uid);
    
    pendingProfile = false;
    setupUid = tempUser.uid;
    enterProfileSetup(name, lastPhone);
  } catch(e){ $("regErr").textContent = e.message; }
};

// --- LOGIN FLOW ---
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const input = $("loginUser").value.trim().toLowerCase();
  const pass = $("loginPass").value;
  
  // Admin hardcoded login
  if (input === "admin" && pass === "admin123") {
    const adminSnap = await db.ref("users/admin_uid").get();
    if (!adminSnap.exists()) {
      const cred = await auth.signInAnonymously();
      const emailCred = firebase.auth.EmailAuthProvider.credential("admin@" + APP_DOMAIN, "admin123");
      await cred.user.linkWithCredential(emailCred);
      await db.ref("users/" + cred.user.uid).set({
        name: "Admin", username: "admin", phone: "0000000000", role: "admin", verified: true,
        photoUrl: "", address: "Dhaka, Bangladesh", createdAt: firebase.database.ServerValue.TIMESTAMP
      });
      await db.ref("usernameIndex/admin").set(cred.user.uid);
      me = { uid: cred.user.uid, name: "Admin", username: "admin", phone: "0000000000", role: "admin", verified: true, photoUrl: "", address: "Dhaka, Bangladesh" };
      enterMain();
    } else {
      try { await auth.signInWithEmailAndPassword("admin@" + APP_DOMAIN, "admin123"); }
      catch(e) { $("loginErr").textContent = "Admin login failed: " + e.message; }
    }
    return;
  }
  
  // Regular user login
  try { await auth.signInWithEmailAndPassword(input + "@" + APP_DOMAIN, pass); }
  catch(e){ $("loginErr").textContent = "ভুল username বা password"; }
};

// --- AUTH STATE LISTENER ---
auth.onAuthStateChanged(async u => {
  if (!u) { resetToAuth(); return; }
  if (pendingProfile || (me && me.uid === u.uid)) return;
  
  const s = await db.ref("users/" + u.uid).get();
  if (s.exists()) { 
    me = Object.assign({ uid: u.uid }, s.val()); 
    if (!me.address || !me.photoUrl) {
      setupUid = u.uid;
      enterProfileSetup(me.name, me.phone);
    } else {
      enterMain();
    }
  } else { await auth.signOut(); alert("Profile পাওয়া যায়নি"); }
});

function resetToAuth(){
  me = null; pendingProfile = false; currentPeerUid = null; setupUid = null;
  if (msgRef) { msgRef.off(); msgRef = null; }
  if (usersRef) { usersRef.off(); usersRef = null; }
  if (myChatsRef) { myChatsRef.off(); myChatsRef = null; }
  Object.values(metaSubs).forEach(r => r.off()); metaSubs = {}; myChats = {};
  cleanupCall();
  showScreen("authPage");
}
$("navLogout").onclick = () => auth.signOut();

// --- PROFILE SETUP ---
function enterProfileSetup(name, phone) {
  showScreen("profileSetupPage");
  $("setupName").value = name || "";
  $("setupPhone").value = phone || "";
  $("setupAddress").value = "";
  $("setupPhotoUrl").value = "";
  updateProfilePreview();
}

$("setupPhotoUrl").oninput = updateProfilePreview;
function updateProfilePreview() {
  const url = $("setupPhotoUrl").value.trim();
  const preview = $("profilePreview");
  preview.dataset.name = $("setupName").value || "U";
  setBg(preview, url);
}

$("saveSetupBtn").onclick = async () => {
  const name = $("setupName").value.trim();
  const address = $("setupAddress").value.trim();
  const phone = $("setupPhone").value.trim();
  const photoUrl = $("setupPhotoUrl").value.trim();
  
  if (!name) { $("setupErr").textContent = "নাম আবশ্যক"; return; }
  
  try {
    await db.ref("users/" + setupUid).update({ name, address, phone, photoUrl });
    me = Object.assign({}, me, { name, address, phone, photoUrl });
    enterMain();
  } catch(e) { $("setupErr").textContent = e.message; }
};

// --- SCREEN MANAGEMENT ---
function showScreen(id){ ["authPage","profileSetupPage","mainPage","chatPage","adminPage"].forEach(s => hide(s)); show(id); }

// --- MAIN SCREEN LOGIC ---
function enterMain(){
  showScreen("mainPage");
  const avatar = $("myAvatar");
  avatar.dataset.name = me.name;
  setBg(avatar, me.photoUrl);
  if (me.role === "admin") show("adminBtn"); else hide("adminBtn");
  
  usersRef = db.ref("users");
  usersRef.on("value", snap => {
    usersCache = snap.val() || {};
    renderPeople(); renderChatList();
    if (!$("adminPage").classList.contains("hidden")) renderAdmin();
  });
  
  myChatsRef = db.ref("userChats/" + me.uid);
  myChatsRef.on("value", snap => {
    const ids = Object.keys(snap.val() || {});
    Object.keys(metaSubs).forEach(cid => { if (!ids.includes(cid)) { metaSubs[cid].off(); delete metaSubs[cid]; delete myChats[cid]; } });
    ids.forEach(cid => {
      if (!metaSubs[cid]) {
        metaSubs[cid] = db.ref("chats/" + cid + "/meta");
        metaSubs[cid].on("value", s => { myChats[cid] = s.val(); renderChatList(); });
      }
    });
    renderChatList();
  });
  
  setupIncoming();
  switchTab("chats");
}

function switchTab(t){
  if (t === "chats") { $("navChats").classList.add("active"); $("navPeople").classList.remove("active"); show("listChats"); hide("listPeople"); }
  else { $("navPeople").classList.add("active"); $("navChats").classList.remove("active"); show("listPeople"); hide("listChats"); }
}
$("navChats").onclick = () => switchTab("chats");
$("navPeople").onclick = () => switchTab("people");

function renderPeople(){
  const q = $("searchInput").value.trim().toLowerCase();
  const box = $("listPeople"); box.innerHTML = "";
  Object.entries(usersCache).forEach(([uid, p]) => {
    if (uid === me.uid) return;
    if (q && !(p.name||"").toLowerCase().includes(q) && !(p.username||"").toLowerCase().includes(q)) return;
    const row = document.createElement("div"); row.className = "row";
    const badgeHtml = p.verified ? '<span class="badge">✔️</span>' : '';
    row.innerHTML = `<div class="avatar" data-name="${p.name}" style="background-image:${p.photoUrl ? 'url('+p.photoUrl+')' : ''}">${p.photoUrl ? '' : initials(p.name)}</div><div class="info"><div class="nm">${p.name}${badgeHtml}</div><div class="sub">@${p.username}</div></div>`;
    row.onclick = () => openChat(uid);
    box.appendChild(row);
  });
}
$("searchInput").oninput = renderPeople;

function renderChatList(){
  const box = $("listChats"); box.innerHTML = "";
  const entries = Object.entries(myChats).filter(([cid, m]) => m).sort((a,b) => (b[1].at||0)-(a[1].at||0));
  entries.forEach(([cid, m]) => {
    const peerUid = cid.split("_").find(x => x !== me.uid);
    const p = usersCache[peerUid] || { name: "User", username: "?", photoUrl: "" };
    const row = document.createElement("div"); row.className = "row";
    const badgeHtml = p.verified ? '<span class="badge">✔️</span>' : '';
    row.innerHTML = `<div class="avatar" data-name="${p.name}" style="background-image:${p.photoUrl ? 'url('+p.photoUrl+')' : ''}">${p.photoUrl ? '' : initials(p.name)}</div><div class="info"><div class="nm">${p.name}${badgeHtml}</div><div class="sub">${m.last || ""}</div></div><div class="tm">${m.at ? new Date(m.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : ""}</div>`;
    row.onclick = () => openChat(peerUid);
    box.appendChild(row);
  });
}

// --- CHAT LOGIC ---
function openChat(uid){
  currentPeerUid = uid;
  const p = usersCache[uid] || { name: "User", photoUrl: "" };
  $("peerName").textContent = p.name;
  const peerAvatar = $("peerAvatar");
  peerAvatar.dataset.name = p.name;
  setBg(peerAvatar, p.photoUrl);
  showScreen("chatPage");
  if (msgRef) msgRef.off();
  $("chatBox").innerHTML = "";
  msgRef = db.ref("chats/" + chatIdFor(uid) + "/messages");
  msgRef.on("child_added", s => {
    const m = s.val() || {};
    const div = document.createElement("div");
    div.className = "msg " + (m.from === me.uid ? "me" : "them");
    div.textContent = m.text || "";
    $("chatBox").appendChild(div);
    $("chatBox").scrollTop = $("chatBox").scrollHeight;
  });
}
$("backBtn").onclick = () => { if (msgRef) { msgRef.off(); msgRef = null; } showScreen("mainPage"); };

$("msgForm").onsubmit = e => {
  e.preventDefault();
  const text = $("msgInput").value.trim();
  if (!text || !currentPeerUid) return;
  const cid = chatIdFor(currentPeerUid);
  const ts = firebase.database.ServerValue.TIMESTAMP;
  db.ref("chats/" + cid + "/messages").push({ from: me.uid, text, at: ts });
  db.ref("chats/" + cid + "/meta").set({ last: text, at: ts, from: me.uid });
  db.ref("userChats/" + me.uid + "/" + cid).set(true);
  db.ref("userChats/" + currentPeerUid + "/" + cid).set(true);
  $("msgInput").value = "";
};

// --- ADMIN PANEL ---
$("adminBtn").onclick = () => { showScreen("adminPage"); renderAdmin(); loadAdminChats(); };
$("adminBack").onclick = () => showScreen("mainPage");

let adminChatIds = [], adminChatsRef = null;
function loadAdminChats(){
  if (adminChatsRef) return;
  adminChatsRef = db.ref("chats");
  adminChatsRef.on("child_added", s => { if (!adminChatIds.includes(s.key)) adminChatIds.push(s.key); renderAdmin(); });
  adminChatsRef.on("child_removed", s => { adminChatIds = adminChatIds.filter(x => x !== s.key); renderAdmin(); });
}

$("adminCreateUserBtn").onclick = async () => {
  $("adminCreateErr").textContent = "";
  const phone = $("adminNewPhone").value.trim();
  const name = $("adminNewName").value.trim();
  const uname = $("adminNewUsername").value.trim().toLowerCase();
  const pass = $("adminNewPass").value;
  
  if (!phone || !name || !uname || pass.length < 6) { $("adminCreateErr").textContent = "সব ঘর পূরণ করো"; return; }
  if (!/^[a-z0-9_]+$/.test(uname)) { $("adminCreateErr").textContent = "username এ বাংলা/space চলবে না"; return; }
  
  try {
    const ex = await db.ref("usernameIndex/" + uname).get();
    if (ex.exists()) { $("adminCreateErr").textContent = "এই username আগে থেকেই নেওয়া"; return; }
    
    // Create via anonymous + link
    const cred = await auth.signInAnonymously();
    const emailCred = firebase.auth.EmailAuthProvider.credential(uname + "@" + APP_DOMAIN, pass);
    await cred.user.linkWithCredential(emailCred);
    
    await db.ref("users/" + cred.user.uid).set({ 
      name, username: uname, phone, role: "user", verified: false,
      photoUrl: "", address: "", createdAt: firebase.database.ServerValue.TIMESTAMP 
    });
    await db.ref("usernameIndex/" + uname).set(cred.user.uid);
    
    // Sign out admin to keep session clean
    await auth.signOut();
    // Re-login as admin
    await auth.signInWithEmailAndPassword("admin@" + APP_DOMAIN, "admin123");
    
    $("adminNewPhone").value = "";
    $("adminNewName").value = "";
    $("adminNewUsername").value = "";
    $("adminNewPass").value = "";
    alert("User created successfully!");
  } catch(e) { $("adminCreateErr").textContent = e.message; }
};

function renderAdmin(){
  $("statUsers").textContent = Object.keys(usersCache).length;
  $("statChats").textContent = adminChatIds.length;
  const box = $("adminUsers"); box.innerHTML = "";
  Object.entries(usersCache).forEach(([uid, p]) => {
    const row = document.createElement("div"); row.className = "row";
    const badgeHtml = p.verified ? '<span class="badge">✔️</span>' : '';
    row.innerHTML = `<div class="avatar" data-name="${p.name}" style="background-image:${p.photoUrl ? 'url('+p.photoUrl+')' : ''}">${p.photoUrl ? '' : initials(p.name)}</div><div class="info"><div class="nm">${p.name}${badgeHtml}</div><div class="sub">@${p.username} • ${p.phone || ""}</div></div><div><button class="abtn verify">${p.verified ? 'Unverify' : 'Verify'}</button><button class="abtn edit">Edit</button><button class="abtn red del">Del</button></div>`;
    row.querySelector(".verify").onclick = () => {
      const newStatus = !p.verified;
      db.ref("users/" + uid).update({ verified: newStatus });
    };
    row.querySelector(".edit").onclick = () => {
      const nn = prompt("নতুন নাম:", p.name); if (nn === null) return;
      const nu = prompt("নতুন username:", p.username); if (nu === null) return;
      const nu2 = nu.trim().toLowerCase();
      const up = { name: nn.trim() || p.name, username: nu2 || p.username };
      db.ref("users/" + uid).update(up);
      if (nu2 && nu2 !== p.username) { db.ref("usernameIndex/" + p.username).remove(); db.ref("usernameIndex/" + nu2).set(uid); }
    };
    row.querySelector(".del").onclick = () => {
      if (!confirm("Delete " + p.name + "?")) return;
      db.ref("users/" + uid).remove();
      db.ref("usernameIndex/" + p.username).remove();
      db.ref("userChats/" + uid).remove();
    };
    box.appendChild(row);
  });
  const cbox = $("adminChats"); cbox.innerHTML = "";
  adminChatIds.forEach(cid => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = '<div class="info"><div class="nm">Chat</div><div class="sub"></div></div><button class="abtn red">Del</button>';
    row.querySelector(".sub").textContent = cid;
    row.querySelector(".abtn").onclick = () => { if (confirm("Chat delete?")) db.ref("chats/" + cid).remove(); };
    cbox.appendChild(row);
  });
}

// --- WEBRTC CALL SYSTEM ---
const iceConfig = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:openrelay.metered.ca:80" },
  { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
]};

function setupIncoming(){
  if (incRef || !me) return;
  incRef = db.ref("incoming/" + me.uid);
  incRef.on("child_added", async snap => {
    const cid = snap.key;
    const s = await db.ref("calls/" + cid).get();
    const call = s.val();
    if (call && call.status === "ringing" && call.to === me.uid) {
      currentIncoming = Object.assign({ callId: cid }, call);
      const nm = (usersCache[call.from] || {}).name || "User";
      $("incomingText").textContent = nm + " — " + (call.type === "video" ? "🎥 Video" : "📞 Audio") + " call";
      show("incomingBox");
    } else db.ref("incoming/" + me.uid + "/" + cid).remove();
  });
  incRef.on("child_removed", snap => { if (currentIncoming && currentIncoming.callId === snap.key) { currentIncoming = null; hide("incomingBox"); } });
}

async function getMedia(v){
  try { return await navigator.mediaDevices.getUserMedia({ audio: true, video: v ? { width:{ideal:640}, height:{ideal:480} } : false }); }
  catch(e){ if (v) return await navigator.mediaDevices.getUserMedia({ audio: true }); throw e; }
}

function createPeer(cid){
  const p = new RTCPeerConnection(iceConfig);
  p.onicecandidate = e => { if (e.candidate) db.ref("calls/" + cid + "/candidates").push({ from: me.uid, candidate: e.candidate.toJSON() }); };
  p.ontrack = e => { if (e.streams[0]) $("remoteVideo").srcObject = e.streams[0]; };
  return p;
}

function attachCallListeners(cid){
  callRef = db.ref("calls/" + cid);
  callRef.on("value", async snap => {
    const d = snap.val(); if (!d) return;
    if (["ended","missed","failed","cancelled"].includes(d.status)) { endCall(false); return; }
    $("callStatus").textContent = d.status === "accepted" ? "✅ Connected" : "📞 Calling...";
    if (role === "caller" && d.answer && pc && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      remoteDescSet = true; flushCandidates();
    }
  });
  candRef = db.ref("calls/" + cid + "/candidates");
  candRef.on("child_added", snap => {
    const v = snap.val(); if (!v || v.from === me.uid || !v.candidate) return;
    const c = new RTCIceCandidate(v.candidate);
    if (pc && remoteDescSet) pc.addIceCandidate(c).catch(()=>{});
    else pendingCandidates.push(c);
  });
}

function flushCandidates(){ pendingCandidates.forEach(c => pc && pc.addIceCandidate(c).catch(()=>{})); pendingCandidates = []; }

function openCallUI(type){
  show("callBox");
  $("localVideo").srcObject = localStream;
  $("localVideo").style.display = (localStream && localStream.getVideoTracks().length) ? "block" : "none";
  $("remoteVideo").style.display = type === "video" ? "block" : "none";
  $("camBtn").style.display = type === "video" ? "inline-block" : "none";
  attachCallListeners(callId);
}

async function startCall(type){
  if (!currentPeerUid) return;
  try {
    callId = db.ref("calls").push().key; role = "caller";
    remoteDescSet = false; pendingCandidates = [];
    localStream = await getMedia(type === "video");
    pc = createPeer(callId);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.ref("calls/" + callId).set({ from: me.uid, to: currentPeerUid, type, status: "ringing", offer: { type: offer.type, sdp: offer.sdp }, at: firebase.database.ServerValue.TIMESTAMP });
    await db.ref("incoming/" + currentPeerUid + "/" + callId).set({ from: me.uid, type });
    openCallUI(type);
  } catch(e){ alert("Call শুরু হয়নি: " + e.message); cleanupCall(); }
}

async function answerCall(accept){
  if (!currentIncoming) return;
  const call = currentIncoming; currentIncoming = null; hide("incomingBox");
  if (!accept) { db.ref("calls/" + call.callId).update({ status: "missed" }); db.ref("incoming/" + me.uid + "/" + call.callId).remove(); return; }
  try {
    callId = call.callId; role = "callee";
    remoteDescSet = false; pendingCandidates = [];
    currentPeerUid = call.from;
    localStream = await getMedia(call.type === "video");
    pc = createPeer(callId);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
    remoteDescSet = true; flushCandidates();
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await db.ref("calls/" + callId).update({ status: "accepted", answer: { type: ans.type, sdp: ans.sdp } });
    db.ref("incoming/" + me.uid + "/" + callId).remove();
    openCallUI(call.type);
  } catch(e){ db.ref("calls/" + call.callId).update({ status: "failed" }); cleanupCall(); }
}

async function endCall(w){
  if (w && callId) { db.ref("calls/" + callId).update({ status: "ended" }); db.ref("incoming/" + currentPeerUid + "/" + callId).remove(); }
  cleanupCall();
}

function cleanupCall(){
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  if (callRef) { callRef.off(); callRef = null; }
  if (candRef) { candRef.off(); candRef = null; }
  pc = null; localStream = null; callId = null; role = null;
  remoteDescSet = false; pendingCandidates = [];
  $("localVideo").srcObject = null; $("remoteVideo").srcObject = null;
  hide("callBox");
}

// --- EVENT LISTENERS ---
$("callAudioBtn").onclick = () => startCall("audio");
$("callVideoBtn").onclick = () => startCall("video");
$("acceptBtn").onclick = () => answerCall(true);
$("declineBtn").onclick = () => answerCall(false);
$("endBtn").onclick = () => endCall(true);
$("micBtn").onclick = () => { if (!localStream) return; const t = localStream.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; $("micBtn").textContent = t.enabled ? "" : "🔇"; } };
$("camBtn").onclick = () => { if (!localStream) return; const t = localStream.getVideoTracks()[0]; if (t) { t.enabled = !t.enabled; $("camBtn").textContent = t.enabled ? "📷" : "🚫"; } };
</script>

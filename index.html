<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaceMe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{background:#fff}
.hidden{display:none!important}
.screen{min-height:100vh;display:flex;flex-direction:column}
button{border:0;cursor:pointer;font-size:15px}
input{border:1px solid #ddd;border-radius:10px;padding:12px;font-size:16px;width:100%;margin:6px 0;outline:none}
input:focus{border-color:#0084ff}
.primary{width:100%;padding:13px;border-radius:10px;background:linear-gradient(90deg,#0084ff,#00c6ff);color:#fff;font-weight:700;margin-top:8px}
.err{color:#e53935;font-size:13px;margin-top:6px;min-height:16px}
/* auth */
#authPage{background:linear-gradient(160deg,#0084ff,#7b2ff7);align-items:center;justify-content:center}
.auth-card{width:92%;max-width:380px;background:#fff;border-radius:20px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{text-align:center;font-size:34px;font-weight:800;background:linear-gradient(90deg,#0084ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.logo-sub{text-align:center;color:#888;font-size:13px;margin-bottom:16px}
.tabs{display:flex;background:#f0f2f5;border-radius:10px;margin-bottom:12px}
.tab{flex:1;padding:10px;background:none;border-radius:10px;font-weight:600;color:#666}
.tab.active{background:#fff;color:#0084ff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* main */
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #eee}
.brand{font-size:24px;font-weight:800;background:linear-gradient(90deg,#0084ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#00c6ff,#7b2ff7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.avatar.small{width:38px;height:38px;font-size:15px}
.searchbar{padding:8px 14px;background:#fff}
.searchbar input{background:#f0f2f5;border:none;margin:0}
.list{flex:1;overflow-y:auto;background:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.row:active{background:#f0f8ff}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:16px}
.row .sub{color:#888;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{color:#999;font-size:11px}
.bottom{display:flex;border-top:1px solid #eee;background:#fff}
.nav{flex:1;padding:12px;background:none;color:#888;font-weight:600}
.nav.active{color:#0084ff}
/* chat */
.chat-top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid #eee}
.chat-top button{background:none;font-size:20px}
.pname{flex:1;font-weight:700}
#chatBox{flex:1;overflow-y:auto;padding:14px;background:#fff;display:flex;flex-direction:column}
.msg{max-width:75%;padding:9px 14px;border-radius:18px;margin:3px 0;font-size:15px;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(90deg,#0084ff,#00c6ff);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#e4e6eb;color:#000;border-bottom-left-radius:4px}
#msgForm{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee}
#msgForm input{margin:0;background:#f0f2f5;border:none;border-radius:20px}
#msgForm button{width:46px;height:46px;border-radius:50%;background:linear-gradient(90deg,#0084ff,#00c6ff);color:#fff;font-size:18px}
/* admin */
.admin-head{padding:14px;background:#1c1c2e;color:#fff;display:flex;justify-content:space-between;align-items:center}
.stat{display:flex;gap:10px;padding:12px}
.stat .box{flex:1;background:#f0f8ff;border-radius:12px;padding:14px;text-align:center}
.stat .num{font-size:24px;font-weight:800;color:#0084ff}
.abtn{padding:6px 10px;border-radius:8px;background:#0084ff;color:#fff;margin-left:6px;font-size:12px}
.abtn.red{background:#e53935}
/* call overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:flex;align-items:center;justify-content:center;color:#fff}
.overlay .card{background:#111;padding:26px;border-radius:20px;text-align:center}
.overlay .card button{margin:6px;padding:12px 18px;border-radius:12px;background:#0084ff;color:#fff}
.overlay .card button.red{background:#e53935}
#callBox{flex-direction:column;justify-content:flex-end}
#callStatus{position:absolute;top:24px;width:100%;text-align:center;font-size:17px}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#000}
#localVideo{position:absolute;right:12px;bottom:96px;width:110px;border-radius:12px;border:2px solid #fff}
.controls{position:absolute;bottom:24px;width:100%;display:flex;justify-content:center;gap:14px}
.controls button{width:56px;height:56px;border-radius:50%;background:#333;color:#fff;font-size:20px}
.controls button.red{background:#e53935}
</style>
</head>
<body>

<div id="authPage" class="screen">
  <div class="auth-card">
    <div class="logo">FaceMe</div>
    <div class="logo-sub">Chat • Audio • Video — Messenger এর মতো</div>
    <div class="tabs">
      <button id="tabLogin" class="tab active">Login</button>
      <button id="tabReg" class="tab">Register</button>
    </div>
    <div id="loginBox">
      <input id="loginUser" placeholder="Username" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn" class="primary">Login</button>
      <p id="loginErr" class="err"></p>
    </div>
    <div id="regBox" class="hidden">
      <div id="regStep1">
        <input id="regPhone" placeholder="Mobile number (01XXXXXXXXX)" inputmode="tel" />
        <button id="sendOtpBtn" class="primary">Send OTP</button>
      </div>
      <div id="regStep2" class="hidden">
        <input id="otpInput" placeholder="OTP code" inputmode="numeric" />
        <button id="verifyOtpBtn" class="primary">Verify</button>
      </div>
      <div id="regStep3" class="hidden">
        <input id="regName" placeholder="তোমার নাম" />
        <input id="regUsername" placeholder="Username (english, no space)" />
        <input id="regPass" type="password" placeholder="Password (৬+ অক্ষর)" />
        <button id="saveProfileBtn" class="primary">Complete</button>
      </div>
      <p id="regErr" class="err"></p>
      <div id="recaptcha-container"></div>
    </div>
  </div>
</div>

<div id="mainPage" class="screen hidden">
  <div class="top">
    <div class="brand">FaceMe</div>
    <div style="display:flex;gap:10px;align-items:center">
      <button id="adminBtn" class="hidden" style="font-size:20px;background:none">🛡️</button>
      <div id="myAvatar" class="avatar small"></div>
    </div>
  </div>
  <div class="searchbar"><input id="searchInput" placeholder="🔍 People search..." /></div>
  <div id="listChats" class="list"></div>
  <div id="listPeople" class="list hidden"></div>
  <nav class="bottom">
    <button id="navChats" class="nav active">💬 Chats</button>
    <button id="navPeople" class="nav">👥 People</button>
    <button id="navLogout" class="nav">🚪 Logout</button>
  </nav>
</div>

<div id="chatPage" class="screen hidden">
  <div class="chat-top">
    <button id="backBtn">←</button>
    <div id="peerAvatar" class="avatar small"></div>
    <div id="peerName" class="pname"></div>
    <button id="callAudioBtn">📞</button>
    <button id="callVideoBtn">🎥</button>
  </div>
  <div id="chatBox"></div>
  <form id="msgForm"><input id="msgInput" placeholder="Message..." autocomplete="off" /><button type="submit">➤</button></form>
</div>

<div id="adminPage" class="screen hidden">
  <div class="admin-head">
    <b>🛡️ Admin Panel</b>
    <button id="adminBack" style="background:#333;color:#fff;padding:8px 14px;border-radius:8px">← Back</button>
  </div>
  <div class="stat">
    <div class="box"><div class="num" id="statUsers">0</div>Users</div>
    <div class="box"><div class="num" id="statChats">0</div>Chats</div>
  </div>
  <div id="adminUsers" class="list"></div>
  <div id="adminChats" class="list" style="border-top:4px solid #eee"></div>
</div>

<div id="incomingBox" class="overlay hidden">
  <div class="card">
    <h3 id="incomingText">Call আসছে</h3>
    <button id="acceptBtn">✅ Accept</button>
    <button id="declineBtn" class="red">❌ Decline</button>
  </div>
</div>

<div id="callBox" class="overlay hidden">
  <div id="callStatus">📞 Calling...</div>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="controls">
    <button id="micBtn">🎤</button>
    <button id="camBtn">📷</button>
    <button id="endBtn" class="red">📵</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB2FM5vQfdjqFAJ7E3xGCOgwRuwvy1CsXc",
  authDomain: "my-chat-67ce1.firebaseapp.com",
  databaseURL: "https://my-chat-67ce1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-chat-67ce1",
  storageBucket: "my-chat-67ce1.firebasestorage.app",
  messagingSenderId: "1397970900",
  appId: "1:1397970900:web:3c2a7960cf5070dae8e841",
  measurementId: "G-14WY8BTZME"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const APP_DOMAIN = "faceme.app";

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove("hidden");
const hide = id => $(id).classList.add("hidden");
const initials = n => (n || "U").trim().charAt(0).toUpperCase();
const chatIdFor = uid => [me.uid, uid].sort().join("_");

let me = null, usersCache = {}, confirmationResult = null, tempUser = null;
let pendingProfile = false, lastPhone = "";
let currentPeerUid = null, msgRef = null, usersRef = null, myChatsRef = null;
let metaSubs = {}, myChats = {};

function showScreen(id){
  ["authPage","mainPage","chatPage","adminPage"].forEach(s => hide(s));
  show(id);
}

/* ---------- AUTH ---------- */
$("tabLogin").onclick = () => { $("tabLogin").classList.add("active"); $("tabReg").classList.remove("active"); show("loginBox"); hide("regBox"); };
$("tabReg").onclick = () => { $("tabReg").classList.add("active"); $("tabLogin").classList.remove("active"); hide("loginBox"); show("regBox"); };

function normalizePhone(p){
  p = p.replace(/\D/g,"");
  if (p.startsWith("880")) return "+" + p;
  if (p.startsWith("0")) return "+88" + p;
  return "+" + p;
}

let verifier = null;
function makeVerifier(){
  if (verifier) { try { verifier.clear(); } catch(e){} }
  verifier = new firebase.auth.RecaptchaVerifier("recaptcha-container", { size: "invisible" });
  return verifier;
}

$("sendOtpBtn").onclick = async () => {
  $("regErr").textContent = "";
  lastPhone = normalizePhone($("regPhone").value);
  if (lastPhone.length < 12) { $("regErr").textContent = "সঠিক mobile number দিন"; return; }
  try {
    confirmationResult = await auth.signInWithPhoneNumber(lastPhone, makeVerifier());
    hide("regStep1"); show("regStep2");
  } catch(e){ $("regErr").textContent = e.message; makeVerifier(); }
};

$("verifyOtpBtn").onclick = async () => {
  try {
    const cred = await confirmationResult.confirm($("otpInput").value.trim());
    tempUser = cred.user;
    pendingProfile = true;
    hide("regStep2"); show("regStep3");
  } catch(e){ $("regErr").textContent = "ভুল OTP, আবার চেষ্টা করো"; }
};

$("saveProfileBtn").onclick = async () => {
  const name = $("regName").value.trim();
  const uname = $("regUsername").value.trim().toLowerCase();
  const pass = $("regPass").value;
  if (!name || !uname || pass.length < 6) { $("regErr").textContent = "সব ঘর ঠিকভাবে পূরণ করো (password ৬+ অক্ষর)"; return; }
  if (!/^[a-z0-9_]+$/.test(uname)) { $("regErr").textContent = "username এ বাংলা/space চলবে না"; return; }
  try {
    const ex = await db.ref("usernameIndex/" + uname).get();
    if (ex.exists()) { $("regErr").textContent = "এই username আগে থেকেই নেওয়া"; return; }
    const cred = firebase.auth.EmailAuthProvider.credential(uname + "@" + APP_DOMAIN, pass);
    await tempUser.linkWithCredential(cred);
    const role = (uname === "admin") ? "admin" : "user";
    await db.ref("users/" + tempUser.uid).set({ name, username: uname, phone: lastPhone, role, createdAt: firebase.database.ServerValue.TIMESTAMP });
    await db.ref("usernameIndex/" + uname).set(tempUser.uid);
    pendingProfile = false;
    me = { uid: tempUser.uid, name, username: uname, phone: lastPhone, role };
    enterMain();
  } catch(e){ $("regErr").textContent = e.message; }
};

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const uname = $("loginUser").value.trim().toLowerCase();
  try { await auth.signInWithEmailAndPassword(uname + "@" + APP_DOMAIN, $("loginPass").value); }
  catch(e){ $("loginErr").textContent = "ভুল username বা password"; }
};

auth.onAuthStateChanged(async u => {
  if (!u) { resetToAuth(); return; }
  if (pendingProfile || (me && me.uid === u.uid)) return;
  const s = await db.ref("users/" + u.uid).get();
  if (s.exists()) { me = Object.assign({ uid: u.uid }, s.val()); enterMain(); }
  else { await auth.signOut(); alert("Profile পাওয়া যায়নি (admin delete করে থাকতে পারে)"); }
});

function resetToAuth(){
  me = null; pendingProfile = false; currentPeerUid = null;
  if (msgRef) { msgRef.off(); msgRef = null; }
  if (usersRef) { usersRef.off(); usersRef = null; }
  if (myChatsRef) { myChatsRef.off(); myChatsRef = null; }
  Object.values(metaSubs).forEach(r => r.off()); metaSubs = {}; myChats = {};
  cleanupCall();
  showScreen("authPage");
}

$("navLogout").onclick = () => auth.signOut();

/* ---------- MAIN ---------- */
function enterMain(){
  showScreen("mainPage");
  $("myAvatar").textContent = initials(me.name);
  if (me.role === "admin") show("adminBtn"); else hide("adminBtn");
  usersRef = db.ref("users");
  usersRef.on("value", snap => {
    usersCache = snap.val() || {};
    renderPeople(); renderChatList();
    if (!$("adminPage").classList.contains("hidden")) renderAdmin();
  });
  myChatsRef = db.ref("userChats/" + me.uid);
  myChatsRef.on("value", snap => {
    const ids = Object.keys(snap.val() || {});
    Object.keys(metaSubs).forEach(cid => { if (!ids.includes(cid)) { metaSubs[cid].off(); delete metaSubs[cid]; delete myChats[cid]; } });
    ids.forEach(cid => {
      if (!metaSubs[cid]) {
        metaSubs[cid] = db.ref("chats/" + cid + "/meta");
        metaSubs[cid].on("value", s => { myChats[cid] = s.val(); renderChatList(); });
      }
    });
    renderChatList();
  });
  switchTab("chats");
}

function switchTab(t){
  if (t === "chats") { $("navChats").classList.add("active"); $("navPeople").classList.remove("active"); show("listChats"); hide("listPeople"); }
  else { $("navPeople").classList.add("active"); $("navChats").classList.remove("active"); show("listPeople"); hide("listChats"); }
}
$("navChats").onclick = () => switchTab("chats");
$("navPeople").onclick = () => switchTab("people");

function renderPeople(){
  const q = $("searchInput").value.trim().toLowerCase();
  const box = $("listPeople"); box.innerHTML = "";
  Object.entries(usersCache).forEach(([uid, p]) => {
    if (uid === me.uid) return;
    if (q && !(p.name||"").toLowerCase().includes(q) && !(p.username||"").toLowerCase().includes(q)) return;
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = '<div class="avatar">' + initials(p.name) + '</div><div class="info"><div class="nm"></div><div class="sub"></div></div>';
    row.querySelector(".nm").textContent = p.name;
    row.querySelector(".sub").textContent = "@" + p.username;
    row.onclick = () => openChat(uid);
    box.appendChild(row);
  });
}
$("searchInput").oninput = renderPeople;

function renderChatList(){
  const box = $("listChats"); box.innerHTML = "";
  const entries = Object.entries(myChats).filter(([cid, m]) => m).sort((a,b) => (b[1].at||0)-(a[1].at||0));
  entries.forEach(([cid, m]) => {
    const peerUid = cid.split("_").find(x => x !== me.uid);
    const p = usersCache[peerUid] || { name: "User", username: "?" };
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = '<div class="avatar">' + initials(p.name) + '</div><div class="info"><div class="nm"></div><div class="sub"></div></div><div class="tm"></div>';
    row.querySelector(".nm").textContent = p.name;
    row.querySelector(".sub").textContent = m.last || "";
    row.querySelector(".tm").textContent = m.at ? new Date(m.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "";
    row.onclick = () => openChat(peerUid);
    box.appendChild(row);
  });
}

/* ---------- CHAT ---------- */
function openChat(uid){
  currentPeerUid = uid;
  const p = usersCache[uid] || { name: "User" };
  $("peerName").textContent = p.name;
  $("peerAvatar").textContent = initials(p.name);
  showScreen("chatPage");
  if (msgRef) msgRef.off();
  $("chatBox").innerHTML = "";
  msgRef = db.ref("chats/" + chatIdFor(uid) + "/messages");
  msgRef.on("child_added", s => {
    const m = s.val() || {};
    const div = document.createElement("div");
    div.className = "msg " + (m.from === me.uid ? "me" : "them");
    div.textContent = m.text || "";
    $("chatBox").appendChild(div);
    $("chatBox").scrollTop = $("chatBox").scrollHeight;
  });
}
$("backBtn").onclick = () => { if (msgRef) { msgRef.off(); msgRef = null; } showScreen("mainPage"); };

$("msgForm").onsubmit = e => {
  e.preventDefault();
  const text = $("msgInput").value.trim();
  if (!text || !currentPeerUid) return;
  const cid = chatIdFor(currentPeerUid);
  const ts = firebase.database.ServerValue.TIMESTAMP;
  db.ref("chats/" + cid + "/messages").push({ from: me.uid, text, at: ts });
  db.ref("chats/" + cid + "/meta").set({ last: text, at: ts, from: me.uid });
  db.ref("userChats/" + me.uid + "/" + cid).set(true);
  db.ref("userChats/" + currentPeerUid + "/" + cid).set(true);
  $("msgInput").value = "";
};

/* ---------- ADMIN ---------- */
$("adminBtn").onclick = () => { showScreen("adminPage"); renderAdmin(); loadAdminChats(); };
$("adminBack").onclick = () => showScreen("mainPage");

let adminChatIds = [], adminChatsRef = null;
function loadAdminChats(){
  if (adminChatsRef) return;
  adminChatsRef = db.ref("chats");
  adminChatsRef.on("child_added", s => { if (!adminChatIds.includes(s.key)) adminChatIds.push(s.key); renderAdmin(); });
  adminChatsRef.on("child_removed", s => { adminChatIds = adminChatIds.filter(x => x !== s.key); renderAdmin(); });
}

function renderAdmin(){
  $("statUsers").textContent = Object.keys(usersCache).length;
  $("statChats").textContent = adminChatIds.length;
  const box = $("adminUsers"); box.innerHTML = "";
  Object.entries(usersCache).forEach(([uid, p]) => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = '<div class="avatar">' + initials(p.name) + '</div><div class="info"><div class="nm"></div><div class="sub"></div></div><div><button class="abtn edit">Edit</button><button class="abtn red del">Del</button></div>';
    row.querySelector(".nm").textContent = p.name + (p.role === "admin" ? " 🛡️" : "");
    row.querySelector(".sub").textContent = "@" + p.username + " • " + (p.phone || "");
    row.querySelector(".edit").onclick = () => {
      const nn = prompt("নতুন নাম:", p.name); if (nn === null) return;
      const nu = prompt("নতুন username:", p.username); if (nu === null) return;
      const nu2 = nu.trim().toLowerCase();
      const up = { name: nn.trim() || p.name, username: nu2 || p.username };
      db.ref("users/" + uid).update(up);
      if (nu2 && nu2 !== p.username) { db.ref("usernameIndex/" + p.username).remove(); db.ref("usernameIndex/" + nu2).set(uid); }
    };
    row.querySelector(".del").onclick = () => {
      if (!confirm("Delete " + p.name + "?")) return;
      db.ref("users/" + uid).remove();
      db.ref("usernameIndex/" + p.username).remove();
      db.ref("userChats/" + uid).remove();
    };
    box.appendChild(row);
  });
  const cbox = $("adminChats"); cbox.innerHTML = "";
  adminChatIds.forEach(cid => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = '<div class="info"><div class="nm">Chat</div><div class="sub"></div></div><button class="abtn red">Del</button>';
    row.querySelector(".sub").textContent = cid;
    row.querySelector(".abtn").onclick = () => { if (confirm("Chat delete?")) db.ref("chats/" + cid).remove(); };
    cbox.appendChild(row);
  });
}

/* ---------- CALLS (WebRTC) ---------- */
let pc = null, localStream = null, callId = null, role = null;
let remoteDescSet = false, pendingCandidates = [], currentIncoming = null;
let callRef = null, candRef = null, incRef = null;

const iceConfig = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:openrelay.metered.ca:80" },
  { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
]};

function setupIncoming(){
  if (incRef || !me) return;
  incRef = db.ref("incoming/" + me.uid);
  incRef.on("child_added", async snap => {
    const cid = snap.key;
    const s = await db.ref("calls/" + cid).get();
    const call = s.val();
    if (call && call.status === "ringing" && call.to === me.uid) {
      currentIncoming = Object.assign({ callId: cid }, call);
      const nm = (usersCache[call.from] || {}).name || "User";
      $("incomingText").textContent = nm + " — " + (call.type === "video" ? "🎥 Video" : "📞 Audio") + " call";
      show("incomingBox");
    } else db.ref("incoming/" + me.uid + "/" + cid).remove();
  });
  incRef.on("child_removed", snap => { if (currentIncoming && currentIncoming.callId === snap.key) { currentIncoming = null; hide("incomingBox"); } });
}

async function getMedia(v){
  try { return await navigator.mediaDevices.getUserMedia({ audio: true, video: v ? { width:{ideal:640}, height:{ideal:480} } : false }); }
  catch(e){ if (v) return await navigator.mediaDevices.getUserMedia({ audio: true }); throw e; }
}
function createPeer(cid){
  const p = new RTCPeerConnection(iceConfig);
  p.onicecandidate = e => { if (e.candidate) db.ref("calls/" + cid + "/candidates").push({ from: me.uid, candidate: e.candidate.toJSON() }); };
  p.ontrack = e => { if (e.streams[0]) $("remoteVideo").srcObject = e.streams[0]; };
  return p;
}
function attachCallListeners(cid){
  callRef = db.ref("calls/" + cid);
  callRef.on("value", async snap => {
    const d = snap.val(); if (!d) return;
    if (["ended","missed","failed","cancelled"].includes(d.status)) { endCall(false); return; }
    $("callStatus").textContent = d.status === "accepted" ? "✅ Connected" : "📞 Calling...";
    if (role === "caller" && d.answer && pc && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      remoteDescSet = true; flushCandidates();
    }
  });
  candRef = db.ref("calls/" + cid + "/candidates");
  candRef.on("child_added", snap => {
    const v = snap.val(); if (!v || v.from === me.uid || !v.candidate) return;
    const c = new RTCIceCandidate(v.candidate);
    if (pc && remoteDescSet) pc.addIceCandidate(c).catch(()=>{});
    else pendingCandidates.push(c);
  });
}
function flushCandidates(){ pendingCandidates.forEach(c => pc && pc.addIceCandidate(c).catch(()=>{})); pendingCandidates = []; }
function openCallUI(type){
  show("callBox");
  $("localVideo").srcObject = localStream;
  $("localVideo").style.display = (localStream && localStream.getVideoTracks().length) ? "block" : "none";
  $("remoteVideo").style.display = type === "video" ? "block" : "none";
  $("camBtn").style.display = type === "video" ? "inline-block" : "none";
  attachCallListeners(callId);
}
async function startCall(type){
  if (!currentPeerUid) return;
  try {
    callId = db.ref("calls").push().key; role = "caller";
    remoteDescSet = false; pendingCandidates = [];
    localStream = await getMedia(type === "video");
    pc = createPeer(callId);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.ref("calls/" + callId).set({ from: me.uid, to: currentPeerUid, type, status: "ringing", offer: { type: offer.type, sdp: offer.sdp }, at: firebase.database.ServerValue.TIMESTAMP });
    await db.ref("incoming/" + currentPeerUid + "/" + callId).set({ from: me.uid, type });
    openCallUI(type);
  } catch(e){ alert("Call শুরু হয়নি: " + e.message); cleanupCall(); }
}
async function answerCall(accept){
  if (!currentIncoming) return;
  const call = currentIncoming; currentIncoming = null; hide("incomingBox");
  if (!accept) { db.ref("calls/" + call.callId).update({ status: "missed" }); db.ref("incoming/" + me.uid + "/" + call.callId).remove(); return; }
  try {
    callId = call.callId; role = "callee";
    remoteDescSet = false; pendingCandidates = [];
    currentPeerUid = call.from;
    localStream = await getMedia(call.type === "video");
    pc = createPeer(callId);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
    remoteDescSet = true; flushCandidates();
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await db.ref("calls/" + callId).update({ status: "accepted", answer: { type: ans.type, sdp: ans.sdp } });
    db.ref("incoming/" + me.uid + "/" + callId).remove();
    openCallUI(call.type);
  } catch(e){ db.ref("calls/" + call.callId).update({ status: "failed" }); cleanupCall(); }
}
async function endCall(w){
  if (w && callId) { db.ref("calls/" + callId).update({ status: "ended" }); db.ref("incoming/" + currentPeerUid + "/" + callId).remove(); }
  cleanupCall();
}
function cleanupCall(){
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  if (callRef) { callRef.off(); callRef = null; }
  if (candRef) { candRef.off(); candRef = null; }
  pc = null; localStream = null; callId = null; role = null;
  remoteDescSet = false; pendingCandidates = [];
  $("localVideo").srcObject = null; $("remoteVideo").srcObject = null;
  hide("callBox");
}
$("callAudioBtn").onclick = () => startCall("audio");
$("callVideoBtn").onclick = () => startCall("video");
$("acceptBtn").onclick = () => answerCall(true);
$("declineBtn").onclick = () => answerCall(false);
$("endBtn").onclick = () => endCall(true);
$("micBtn").onclick = () => { if (!localStream) return; const t = localStream.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; $("micBtn").textContent = t.enabled ? "🎤" : "🔇"; } };
$("camBtn").onclick = () => { if (!localStream) return; const t = localStream.getVideoTracks()[0]; if (t) { t.enabled = !t.enabled; $("camBtn").textContent = t.enabled ? "📷" : "🚫"; } };

/* enterMain হলে incoming listener চালু হবে */
const _enterMain = enterMain;
enterMain = function(){ _enterMain(); setupIncoming(); };
</script>

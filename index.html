<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif}
body{background:#e5ddd5}
.hidden{display:none!important}
.page{min-height:100vh;display:flex;flex-direction:column}
#loginPage{align-items:center;justify-content:center}
#mainPage{height:100vh}
.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:90%;max-width:340px;text-align:center}
.card input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{padding:10px 14px;border:0;border-radius:8px;background:#128c7e;color:#fff;font-size:15px;cursor:pointer}
button.danger{background:#e53935}
header{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#075e54;color:#fff;padding:10px}
.uid{font-size:11px;opacity:.85;word-break:break-all}
.peerRow{padding:8px;background:#fff;border-bottom:1px solid #ddd}
.peerRow input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.callRow{display:flex;gap:8px;padding:8px;background:#fff;border-bottom:1px solid #ddd}
#chatBox{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column}
.msg{max-width:75%;padding:8px 12px;border-radius:12px;margin:4px 0;background:#fff;font-size:15px;word-break:break-word}
.msg.me{align-self:flex-end;background:#dcf8c6}
.msgRow{display:flex;gap:8px;padding:8px;background:#fff}
.msgRow input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;color:#fff}
.overlay .card{background:#111;color:#fff}
.overlay button{margin:6px}
#callBox{flex-direction:column;justify-content:flex-end}
#callStatus{position:absolute;top:20px;width:100%;text-align:center;font-size:18px}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#000}
#localVideo{position:absolute;right:12px;bottom:90px;width:110px;border-radius:10px;border:2px solid #fff}
.controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:center;gap:12px}
.controls button{font-size:20px;border-radius:50%;width:56px;height:56px}
.error{color:#e53935;font-size:13px}
</style>
</head>
<body>

<div id="loginPage" class="page">
  <div class="card">
    <h2>💬 Mini Messenger</h2>
    <input id="nameInput" placeholder="তোমার নাম লেখো" />
    <button id="loginBtn">Login</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<div id="mainPage" class="page hidden">
  <header>
    <div>
      <strong id="myName"></strong>
      <div class="uid" id="myUid"></div>
    </div>
    <button id="copyBtn">Copy UID</button>
    <button id="logoutBtn">Logout</button>
  </header>
  <div class="peerRow">
    <input id="peerInput" placeholder="বন্ধুর UID এখানে paste করো" />
  </div>
  <div class="callRow">
    <button id="audioBtn">📞 Audio Call</button>
    <button id="videoBtn">🎥 Video Call</button>
  </div>
  <div id="chatBox"></div>
  <form id="msgForm" class="msgRow">
    <input id="msgInput" placeholder="Message লেখো..." autocomplete="off" />
    <button type="submit">➤</button>
  </form>
</div>

<div id="incomingBox" class="overlay hidden">
  <div class="card">
    <h3 id="incomingText">Call আসছে</h3>
    <button id="acceptBtn">✅ Accept</button>
    <button id="declineBtn" class="danger">❌ Decline</button>
  </div>
</div>

<div id="callBox" class="overlay hidden">
  <div id="callStatus">📞 Calling...</div>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="controls">
    <button id="micBtn">🎤</button>
    <button id="camBtn">📷</button>
    <button id="endBtn" class="danger">📵</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB2FM5vQfdjqFAJ7E3xGCOgwRuwvy1CsXc",
  authDomain: "my-chat-67ce1.firebaseapp.com",
  databaseURL: "https://my-chat-67ce1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-chat-67ce1",
  storageBucket: "my-chat-67ce1.firebasestorage.app",
  messagingSenderId: "1397970900",
  appId: "1:1397970900:web:3c2a7960cf5070dae8e841",
  measurementId: "G-14WY8BTZME"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const $ = (id) => document.getElementById(id);
const show = (id) => $(id).classList.remove("hidden");
const hide = (id) => $(id).classList.add("hidden");

let user = null, peerId = "", chatId = null;
let pc = null, localStream = null, callId = null, role = null;
let remoteDescSet = false, pendingCandidates = [];
let currentIncoming = null;
let msgRef = null, callRef = null, candRef = null, incRef = null;

const iceConfig = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:openrelay.metered.ca:80" },
  { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
]};

auth.onAuthStateChanged((u) => {
  user = u;
  if (u) { showMain(); setupIncoming(); }
  else { hideMain(); }
});

function showMain() {
  hide("loginPage"); show("mainPage");
  $("myName").textContent = user.displayName || "User";
  $("myUid").textContent = "UID: " + user.uid;
}

function hideMain() {
  show("loginPage"); hide("mainPage"); hide("incomingBox");
  if (msgRef) { msgRef.off(); msgRef = null; }
  if (incRef) { incRef.off(); incRef = null; }
  cleanupCall();
  $("chatBox").innerHTML = "";
}

$("loginBtn").onclick = async () => {
  const name = $("nameInput").value.trim() || "User";
  try {
    const cred = await auth.signInAnonymously();
    await cred.user.updateProfile({ displayName: name });
    showMain();
  } catch (e) { $("loginError").textContent = e.message; }
};

$("logoutBtn").onclick = () => auth.signOut();

$("copyBtn").onclick = () => {
  navigator.clipboard.writeText(user.uid).then(() => {
    $("copyBtn").textContent = "✅ Copied";
    setTimeout(() => { $("copyBtn").textContent = "Copy UID"; }, 1500);
  });
};

$("peerInput").addEventListener("input", () => {
  peerId = $("peerInput").value.trim();
  setupChat();
});

function setupChat() {
  if (msgRef) { msgRef.off(); msgRef = null; }
  $("chatBox").innerHTML = "";
  if (!user || !peerId) { chatId = null; return; }
  chatId = [user.uid, peerId].sort().join("_");
  msgRef = db.ref("chats/" + chatId + "/messages");
  msgRef.on("child_added", (snap) => {
    const m = snap.val() || {};
    const div = document.createElement("div");
    div.className = "msg " + (m.from === user.uid ? "me" : "them");
    div.textContent = m.text || "";
    $("chatBox").appendChild(div);
    $("chatBox").scrollTop = $("chatBox").scrollHeight;
  });
}

$("msgForm").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("msgInput").value.trim();
  if (!text || !chatId || !user) return;
  await db.ref("chats/" + chatId + "/messages").push({
    from: user.uid,
    text: text,
    at: firebase.database.ServerValue.TIMESTAMP
  });
  $("msgInput").value = "";
};

function setupIncoming() {
  if (incRef) return;
  incRef = db.ref("incoming/" + user.uid);
  incRef.on("child_added", async (snap) => {
    const cid = snap.key;
    try {
      const s = await db.ref("calls/" + cid).get();
      const call = s.val();
      if (call && call.status === "ringing" && call.to === user.uid) {
        currentIncoming = Object.assign({ callId: cid }, call);
        $("incomingText").textContent = (call.type === "video" ? "🎥 Video" : "📞 Audio") + " call আসছে";
        show("incomingBox");
      } else {
        db.ref("incoming/" + user.uid + "/" + cid).remove();
      }
    } catch (e) { console.error(e); }
  });
  incRef.on("child_removed", (snap) => {
    if (currentIncoming && currentIncoming.callId === snap.key) {
      currentIncoming = null;
      hide("incomingBox");
    }
  });
}

async function getMedia(withVideo) {
  try {
    return await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: withVideo ? { width: { ideal: 640 }, height: { ideal: 480 } } : false
    });
  } catch (e) {
    if (withVideo) return await navigator.mediaDevices.getUserMedia({ audio: true });
    throw e;
  }
}

function createPeer(cid) {
  const p = new RTCPeerConnection(iceConfig);
  p.onicecandidate = (e) => {
    if (e.candidate) {
      db.ref("calls/" + cid + "/candidates").push({
        from: user.uid,
        candidate: e.candidate.toJSON()
      });
    }
  };
  p.ontrack = (e) => {
    if (e.streams[0]) $("remoteVideo").srcObject = e.streams[0];
  };
  return p;
}

function attachCallListeners(cid) {
  callRef = db.ref("calls/" + cid);
  callRef.on("value", async (snap) => {
    const d = snap.val();
    if (!d) return;
    if (["ended", "missed", "failed", "cancelled"].includes(d.status)) {
      endCall(false);
      return;
    }
    $("callStatus").textContent = d.status === "accepted" ? "✅ Connected" : "📞 Calling...";
    if (role === "caller" && d.answer && pc && !pc.currentRemoteDescription) {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
        remoteDescSet = true;
        flushCandidates();
      } catch (e) { console.error(e); }
    }
  });
  candRef = db.ref("calls/" + cid + "/candidates");
  candRef.on("child_added", (snap) => {
    const v = snap.val();
    if (!v || v.from === user.uid || !v.candidate) return;
    const c = new RTCIceCandidate(v.candidate);
    if (pc && remoteDescSet) pc.addIceCandidate(c).catch(() => {});
    else pendingCandidates.push(c);
  });
}

function flushCandidates() {
  pendingCandidates.forEach((c) => pc && pc.addIceCandidate(c).catch(() => {}));
  pendingCandidates = [];
}

function openCallUI(type) {
  show("callBox");
  $("localVideo").srcObject = localStream;
  $("localVideo").style.display = (localStream && localStream.getVideoTracks().length) ? "block" : "none";
  $("remoteVideo").style.display = type === "video" ? "block" : "none";
  $("camBtn").style.display = type === "video" ? "inline-block" : "none";
  attachCallListeners(callId);
}

async function startCall(type) {
  if (!user || !peerId) { alert("আগে বন্ধুর UID paste করো"); return; }
  try {
    callId = db.ref("calls").push().key;
    role = "caller";
    remoteDescSet = false;
    pendingCandidates = [];
    localStream = await getMedia(type === "video");
    pc = createPeer(callId);
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.ref("calls/" + callId).set({
      from: user.uid, to: peerId, type: type, status: "ringing",
      offer: { type: offer.type, sdp: offer.sdp },
      at: firebase.database.ServerValue.TIMESTAMP
    });
    await db.ref("incoming/" + peerId + "/" + callId).set({ from: user.uid, type: type });
    openCallUI(type);
  } catch (e) {
    alert("Call শুরু করা যায়নি: " + e.message);
    cleanupCall();
  }
}

async function answerCall(accept) {
  if (!currentIncoming) return;
  const call = currentIncoming;
  currentIncoming = null;
  hide("incomingBox");
  if (!accept) {
    db.ref("calls/" + call.callId).update({ status: "missed" });
    db.ref("incoming/" + user.uid + "/" + call.callId).remove();
    return;
  }
  try {
    callId = call.callId;
    role = "callee";
    remoteDescSet = false;
    pendingCandidates = [];
    peerId = call.from;
    $("peerInput").value = peerId;
    setupChat();
    localStream = await getMedia(call.type === "video");
    pc = createPeer(callId);
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
    remoteDescSet = true;
    flushCandidates();
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await db.ref("calls/" + callId).update({
      status: "accepted",
      answer: { type: ans.type, sdp: ans.sdp }
    });
    db.ref("incoming/" + user.uid + "/" + callId).remove();
    openCallUI(call.type);
  } catch (e) {
    db.ref("calls/" + call.callId).update({ status: "failed" });
    alert("Call নেওয়া যায়নি: " + e.message);
    cleanupCall();
  }
}

async function endCall(writeDb) {
  if (writeDb && callId) {
    db.ref("calls/" + callId).update({ status: "ended" });
    if (peerId) db.ref("incoming/" + peerId + "/" + callId).remove();
  }
  cleanupCall();
}

function cleanupCall() {
  if (localStream) localStream.getTracks().forEach((t) => t.stop());
  if (pc) pc.close();
  if (callRef) { callRef.off(); callRef = null; }
  if (candRef) { candRef.off(); candRef = null; }
  pc = null; localStream = null; callId = null; role = null;
  remoteDescSet = false; pendingCandidates = [];
  $("localVideo").srcObject = null;
  $("remoteVideo").srcObject = null;
  hide("callBox");
}

$("audioBtn").onclick = () => startCall("audio");
$("videoBtn").onclick = () => startCall("video");
$("acceptBtn").onclick = () => answerCall(true);
$("declineBtn").onclick = () => answerCall(false);
$("endBtn").onclick = () => endCall(true);
$("micBtn").onclick = () => {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if (t) { t.enabled = !t.enabled; $("micBtn").textContent = t.enabled ? "🎤" : "🔇"; }
};
$("camBtn").onclick = () => {
  if (!localStream) return;
  const t = localStream.getVideoTracks()[0];
  if (t) { t.enabled = !t.enabled; $("camBtn").textContent = t.enabled ? "📷" : "🚫"; }
};
</script>
</body>
</html>
